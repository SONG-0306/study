<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        .box {
            font-size: 60px;
            background-color: red;
            padding: 5px 10px;
            color: white;
            border-radius: 5px;
            margin: 0 5px;
            display: inline-block;
            transition: transform 0.1s ease; /* 添加过渡效果 */
        }
        .box1 {
            font-size: 60px;
            background-color: red;
            padding: 5px 10px;
            color: white;
            border-radius: 5px;
            margin: 0 5px;
            display: inline-block;
            transition: transform 0.1s ease; /* 添加过渡效果 */
        }
        .container {
            text-align: center; /* 保持内容居中 */
        }

        body {
            margin: 0; /* 去除默认的外边距 */
            height: 100vh; /* 设置全屏高度 */
            display: flex; /* 使用Flexbox布局 */
            justify-content: center; /* 水平居中 */
            align-items: center; /* 垂直居中 */
            flex-direction: column; /* 垂直方向排列 */
            background-color: #ffe6e9;
            text-align: center;
        }

        img.biaoqin {
            width: 400px;
            height: 400px;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>
<form>
    <img id="image" src="ziyuan/和好1.jpg" class="biaoqin"></img>
    <br>
    <label style="font-size: 40px; color: rgb(0, 0, 0); font-weight: bold;">宝宝，可以和我和好吗？</label>
    <div class="container">
        <button id="Good" type="button" class="box1" onclick="happy()">和好</button>
        <button id="noGood" type="button" class="box">不要</button>
    </div>
</form>
<a href="和好.html">还原和好</a>
<script>
    alert("总不和好，和好就消失咯，宝~~~")
    let images=[
        'ziyuan/和好1.jpg','ziyuan/和好2.jpg','ziyuan/和好3.jpg'
    ];
    let currentIndex = 0;
    let noGoodClickCount = 0; // 计数器，记录“不要”按钮被点击的次数
    function happy() {
        alert("宝宝你最好了，嘻嘻");
    }

    let scale = 1;
    document.getElementById("noGood").addEventListener('click', () => {
        noGoodClickCount++; // 每次点击“不要”按钮时计数器加1
        scale *= 2;
        // 按钮缩放动画
        document.getElementById("Good").style.transform = `scale(${scale})`;
        // 更换图片
        const image=document.getElementById("image")
        image.style.opacity = '0';
        setTimeout(()=>{
            currentIndex = (currentIndex + 1) % images.length;
            image.src = images[currentIndex];
            image.style.opacity = '1';
            if(currentIndex===2){
                setTimeout(()=>{
                    const g=document.querySelector("#Good");
                    g.setAttribute("style","display:none");
                },1000)
            }
        },500);
        // if (noGoodClickCount === 2) {
        //     document.getElementById("Good").style.display = "none";
        // }
    });

</script>
</body>
</html>
